[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt-optimize"
version = "0.1.0dev"
description = "Optimizer orchestrators for catopt: pipelines, regime dispatch, calibration."
requires-python = ">=3.11"
dependencies = ["catopt-core", "catopt-torch", "catopt-carriers", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
