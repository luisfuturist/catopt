[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt-optimize"
version = "0.1.0dev"
description = "Backend-neutral optimizer orchestrator for catopt: pipeline verbs, strategies, regime frontier."
requires-python = ">=3.11"
dependencies = ["catopt-core"]

[tool.setuptools.packages.find]
where = ["src"]
