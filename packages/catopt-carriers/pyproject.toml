[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt-carriers"
version = "0.1.0dev"
description = "Semantic carriers for catopt (om/omd/scan/trace lifts and executors)."
requires-python = ">=3.11"
dependencies = ["catopt-core", "catopt-torch", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
