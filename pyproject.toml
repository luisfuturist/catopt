[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt"
version = "0.1.0dev"
description = "Categorical optimization of neural-network computation graphs — meta distribution (façade over the domain packages in packages/)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catopt-core",
    "catopt-torch",
    "catopt-carriers",
    "catopt-optimize",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "ty>=0.0.84",
    "vulture>=2.16",
    "import-linter>=2.15",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

[dependency-groups]
bench = [
    "matplotlib>=3.8",
    "pandas>=2.0",
]
# OPT-IN, TEST-ONLY differential oracle (Phase 4).  `egglog` drives a
# second equality-saturation engine used *only* by
# tests/test_egglog_oracle.py to cross-check catopt's search on a small
# op/law subset.  It is deliberately NOT in `dev`: the repo stays light
# (egglog is a compiled Rust extension), the oracle test self-skips via
# `pytest.importorskip("egglog")` when the group is absent, and nothing
# under packages/ or catopt/ imports it.  Run with:
#   uv sync --group oracle && .venv/bin/python -m pytest tests/test_egglog_oracle.py
# egglog ships wheels for CPython >= 3.12 only, so the entry carries a
# `python_version` marker: the workspace still declares `>=3.11`, but
# the oracle group only resolves on the 3.12+ interpreters that can run
# it (the dev venv is 3.13).
oracle = [
    "egglog>=14.0; python_version >= '3.12'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "ty>=0.0.84",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["catopt"]
exclude = ["packages*", "tests*", "bench*"]

# --- uv workspace: the domain packages ---------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
catopt-core = { workspace = true }
catopt-torch = { workspace = true }
catopt-carriers = { workspace = true }
catopt-optimize = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The packages are editable-installed, but mutmut runs the suite inside
# a copied ``mutants/`` tree with a per-package ``src/`` layout that is
# *not* on ``sys.path``.  Declaring the source roots here makes pytest
# put them first: harmless for normal runs (same files as the editable
# install) and, under mutmut, it makes the *mutated* copies importable
# so mutation→test correlation works.
pythonpath = [
    "packages/catopt-core/src",
    "packages/catopt-torch/src",
    "packages/catopt-carriers/src",
    "packages/catopt-optimize/src",
]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
]

# --- dead-code + architecture linting (dev tooling) ----------------
# vulture: flag unreachable/unused code at high confidence.  The suite
# is pinned at 100% coverage, so a genuine dead branch is a real
# finding, not noise.  Run `.venv/bin/vulture` (uses these paths) or
# `.venv/bin/vulture packages catopt tests --min-confidence 80`; a
# non-zero exit (3) means dead code.  If a public member is kept only
# for the compatibility aliases, add its name to `ignore_names` here
# rather than leaving a false positive.
[tool.vulture]
min_confidence = 80
paths = ["packages", "catopt", "tests"]

# import-linter: the hexagonal-boundary ratchet.  The key contract is
# "core is torch-free" — catopt-core (the zero-dependency engine) must
# never import the PyTorch adapter or any sibling domain package.  It
# FAILS on the pre-decoupling tree and is the gate Phase 1 makes green.
[tool.importlinter]
root_packages = [
    "catopt_core",
    "catopt_torch",
    "catopt_carriers",
    "catopt_optimize",
    "catopt",
]
# Required so the "core imports no tensor library" contract can forbid
# the external torch/numpy packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is torch-free (and carrier-free)"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = [
    "catopt_torch",
    "catopt_carriers",
    "catopt_optimize",
]

[[tool.importlinter.contracts]]
name = "core imports no tensor library"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = ["torch", "numpy"]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
    # --- pydocstyle (D) ratchet -------------------------------------
    # Docstring quality is enforced, but the currently-violated rules
    # are ratcheted off as a backlog (see AGENTS.md). Remove entries
    # from this list as docstrings are brought up to standard; never
    # add new ones.
    "D203",     # one-blank-line-before-class — conflicts with D211
    "D213",     # multi-line-summary-second-line — conflicts with D212
    "D102",     # missing docstring in public method
    "D103",     # missing docstring in public function
    "D105",     # missing docstring in magic method
    "D107",     # missing docstring in __init__
    "D202",     # no blank line after function docstring
    "D205",     # missing blank line after summary
    "D209",     # new line after last paragraph
    "D301",     # backslash in docstring (use r"""...)
    "D400",     # first line should end with a period
    "D401",     # non-imperative mood
    "D403",     # first word uncapitalized
    "D413",     # missing blank line after last section
]

# The docstring gate applies to shipped code only: tests and bench are
# example/measurement code, not a public API surface.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/**" = ["D"]

# --- typecheck ratchet (ty) ---------------------------------------
# ty is Astral's type checker and replaces the earlier pyright ratchet.
# `[tool.ty.src] include` scopes checking to the shipped packages (the
# same scope pyright used — tests/ and bench/ are not type-checked);
# `exclude` is the temporary opt-out list — remove entries as files get
# annotated. Baseline (ty 0.0.84): 198 errors / 19 files. Excluded files
# are not reported, but are still analyzed when imported by a checked
# file. Each entry: ty-baseline error count + dominant issue, sorted by
# count. New modules under packages/*/src/ are checked automatically —
# keep them clean.
[tool.ty.environment]
python-version = "3.13"
extra-paths = [
    "packages/catopt-core/src",
    "packages/catopt-torch/src",
    "packages/catopt-carriers/src",
    "packages/catopt-optimize/src",
]

[tool.ty.src]
include = ["packages", "catopt"]
exclude = [
    "packages/catopt-core/src/catopt_core/egraph/proof.py",      # 33 — unresolved-attribute on untyped proof objects
    "packages/catopt-core/src/catopt_core/egraph/extract.py",    # 32 — unresolved-attribute on untyped extraction state
    "packages/catopt-carriers/src/catopt_carriers/om.py",        # 19 — invalid-argument-type on Op.make **attrs
    "packages/catopt-carriers/src/catopt_carriers/xcarrier.py",  # 18 — unsupported-operator / invalid-arg on Optional tensors
    "packages/catopt-core/src/catopt_core/typing.py",            # 17 — invalid-argument-type / not-subscriptable generics
    "packages/catopt-carriers/src/catopt_carriers/om_lower.py",  # 15 — invalid-arg/assign/return on Optional subscripts
    "packages/catopt-core/src/catopt_core/cost.py",              # 12 — unresolved-attribute + invalid-return-type
    "packages/catopt-carriers/src/catopt_carriers/scan_lower.py",#  8 — not-subscriptable / invalid-return-type
    "packages/catopt-optimize/src/catopt_optimize/optimize.py",  #  8 — invalid-assignment + unresolved-attribute
    "packages/catopt-core/src/catopt_core/laws/tensor.py",       #  7 — invalid-argument-type (Op vs str)
    "packages/catopt-torch/src/catopt_torch/torch_bridge.py",    #  7 — invalid-arg/assign/method-override
    "packages/catopt-carriers/src/catopt_carriers/omd_lower.py", #  5 — not-subscriptable / invalid-return-type
    "packages/catopt-core/src/catopt_core/meta.py",              #  4 — invalid-argument-type / truthiness-test
    "packages/catopt-torch/src/catopt_torch/report.py",          #  3 — invalid-argument-type / unresolved-attribute
    "packages/catopt-torch/src/catopt_torch/models/__init__.py", #  2 — not-subscriptable (nn.Module __getitem__)
    "packages/catopt-torch/src/catopt_torch/models/ssm.py",      #  2 — unsupported-operator (Tensor|Module)
    "packages/catopt-core/src/catopt_core/egraph/core.py",       #  1 — invalid-return-type
    "packages/catopt-core/src/catopt_core/laws/pairing.py",      #  1 — invalid-assignment
    "packages/catopt-core/src/catopt_core/ir.py",                #  1 — unsupported-operator
]

[tool.ty.terminal]
# Ratchet semantics match the old pyright gate: errors are fatal,
# warnings are not. Excluded files carry their baseline as errors.
error-on-warning = false

[tool.coverage.run]
source = ["catopt_core", "catopt_torch", "catopt_carriers", "catopt_optimize", "catopt"]
branch = true
omit = ["*/tests/*"]

# --- mutation testing (mutmut) -------------------------------------
# Detects weak tests: a mutant that survives means the suite asserts
# nothing about that line.  A *full* run is expensive (it re-runs the
# suite once per mutant), so scope a fast loop with the `only_mutate`
# glob, e.g. `only_mutate = ["packages/catopt-core/src/catopt_core/attrs.py"]`.
#
# STATUS: configured but NOT yet operational for this monorepo.  mutmut
# 3.8 derives a mutant's key from its path relative to cwd
# (`packages.catopt-core.src.catopt_core.attrs.x_foo`) and expects the
# module to be importable under that dotted name, but a per-package
# ``src/`` layout imports as `catopt_core.attrs`.  It also shadows the
# `mutants/` copy via uv's editable-install finder.  Two shims are in
# place for the parts that are fixable from our side (the `pythonpath`
# roots in [tool.pytest.ini_options] and the editable-finder drop in
# tests/conftest.py); the key derivation needs upstream support (or a
# single-package flat checkout).  See AGENTS.md.
[tool.mutmut]
source_paths = [
    "packages/catopt-core/src/catopt_core",
    "packages/catopt-torch/src/catopt_torch",
    "packages/catopt-carriers/src/catopt_carriers",
    "packages/catopt-optimize/src/catopt_optimize",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]
# The tests import the `catopt` compat façade; it must be copied into the
# sandbox too (mutmut's default also_copy only takes tests/ + lockfiles).
also_copy = ["catopt/"]

[tool.coverage.report]
fail_under = 100       # ratcheted upward each refactor phase; target 100
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]
