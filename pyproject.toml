[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt"
version = "0.1.0dev"
description = "Categorical optimization of neural-network computation graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "pyright>=1.1.380",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["catopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.pyright]
# Ratchet: `include` is the whole package so new modules are checked
# automatically; `exclude` is the temporary opt-out list — remove entries
# as files get annotated. Baseline (pyright 1.1.414, standard mode):
# 442 errors / 22 files. Excluded-file diagnostics are not reported, but
# excluded files are still analyzed when imported by checked files.
# Each entry: error count at baseline + dominant issue. Sorted by count.
typeCheckingMode = "standard"
include = ["catopt"]
exclude = [
    "catopt/xcarrier.py",        # 164 — Optional-subscript/operand on un-narrowed dict lookups
    "catopt/om.py",              #  87 — same Optional-heavy rewriting internals
    "catopt/egraph/proof.py",    #  36 — attribute access on untyped proof objects
    "catopt/egraph/extract.py",  #  32 — attribute access on untyped extraction state
    "catopt/om_lower.py",        #  22 — Optional subscripts + incompatible override
    "catopt/typing.py",          #  18 — generic helpers; arg-type mismatches
    "catopt/scan_lower.py",      #  11 — Optional subscripts; None in Tensor dicts
    "catopt/cost.py",            #  10 — FunctionType attr assignment; object→float
    "catopt/omd_lower.py",       #   9 — Optional subscripts; None in Tensor dicts
    "catopt/eps.py",             #   8 — possibly-unbound vars; Optional args
    "catopt/ibp.py",             #   7 — Optional member access on Box intervals
    "catopt/laws/tensor.py",     #   7 — Op passed where str expected
    "catopt/torch_bridge.py",    #   7 — Optional attrs; torch Module return types
    "catopt/optimize.py",        #   6 — "IR not iterable"; arg-type mismatches
    "catopt/report.py",          #   5 — Optional member access; None args
    "catopt/meta.py",            #   3 — list↔dict assignment mismatches
    "catopt/models/__init__.py", #   3 — nn.Module __getitem__; int→Tensor return
    "catopt/models/ssm.py",      #   2 — Tensor|Module arithmetic operators
    "catopt/regime.py",          #   2 — Tensor−object op; IR not iterable
    "catopt/egraph/core.py",     #   1 — dict return-type mismatch
    "catopt/ir.py",              #   1 — int * Optional[int]
    "catopt/laws/pairing.py",    #   1 — tuple assigned to list[int]
]
pythonVersion = "3.13"
# torch and numpy ship usable stubs; keep missing imports an error so a
# broken environment fails loudly instead of silently degrading to Any.
reportMissingImports = "error"

[tool.coverage.run]
source = ["catopt"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 100       # ratcheted upward each refactor phase; target 100
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]