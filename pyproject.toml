[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt"
version = "0.1.0dev"
description = "Categorical optimization of neural-network computation graphs — meta distribution (façade over the domain packages in packages/)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catopt-core",
    "catopt-torch",
    "catopt-carriers",
    "catopt-eps",
    "catopt-optimize",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "pyright>=1.1.380",
]

[dependency-groups]
bench = [
    "matplotlib>=3.8",
    "pandas>=2.0",
]
# OPT-IN, TEST-ONLY differential oracle (Phase 4).  `egglog` drives a
# second equality-saturation engine used *only* by
# tests/test_egglog_oracle.py to cross-check catopt's search on a small
# op/law subset.  It is deliberately NOT in `dev`: the repo stays light
# (egglog is a compiled Rust extension), the oracle test self-skips via
# `pytest.importorskip("egglog")` when the group is absent, and nothing
# under packages/ or catopt/ imports it.  Run with:
#   uv sync --group oracle && .venv/bin/python -m pytest tests/test_egglog_oracle.py
# egglog ships wheels for CPython >= 3.12 only, so the entry carries a
# `python_version` marker: the workspace still declares `>=3.11`, but
# the oracle group only resolves on the 3.12+ interpreters that can run
# it (the dev venv is 3.13).
oracle = [
    "egglog>=14.0; python_version >= '3.12'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "pyright>=1.1.380",
    "vulture>=2.16",
    "import-linter>=2.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["catopt"]
exclude = ["packages*", "tests*", "bench*"]

# --- uv workspace: the domain packages ---------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
catopt-core = { workspace = true }
catopt-torch = { workspace = true }
catopt-carriers = { workspace = true }
catopt-eps = { workspace = true }
catopt-optimize = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
]

# --- dead-code + architecture linting (dev tooling) ----------------
# vulture: flag unreachable/unused code at high confidence.  The suite
# is pinned at 100% coverage, so a genuine dead branch is a real
# finding, not noise.  Run `.venv/bin/vulture` (uses these paths) or
# `.venv/bin/vulture packages catopt tests --min-confidence 80`; a
# non-zero exit (3) means dead code.  If a public member is kept only
# for the compatibility aliases, add its name to `ignore_names` here
# rather than leaving a false positive.
[tool.vulture]
min_confidence = 80
paths = ["packages", "catopt", "tests"]

# import-linter: the hexagonal-boundary ratchet.  The key contract is
# "core is torch-free" — catopt-core (the zero-dependency engine) must
# never import the PyTorch adapter or any sibling domain package.  It
# FAILS on the pre-decoupling tree and is the gate Phase 1 makes green.
[tool.importlinter]
root_packages = [
    "catopt_core",
    "catopt_torch",
    "catopt_carriers",
    "catopt_eps",
    "catopt_optimize",
    "catopt",
]
# Required so the "core imports no tensor library" contract can forbid
# the external torch/numpy packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is torch-free (and carrier-free)"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = [
    "catopt_torch",
    "catopt_carriers",
    "catopt_eps",
    "catopt_optimize",
]

[[tool.importlinter.contracts]]
name = "core imports no tensor library"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = ["torch", "numpy"]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.pyright]
# Ratchet: `include` is the whole package so new modules are checked
# automatically; `exclude` is the temporary opt-out list — remove entries
# as files get annotated. Baseline (pyright 1.1.414, standard mode):
# 442 errors / 22 files. Excluded-file diagnostics are not reported, but
# excluded files are still analyzed when imported by checked files.
# Each entry: error count at baseline + dominant issue. Sorted by count.
typeCheckingMode = "standard"
include = ["packages", "catopt"]
extraPaths = [
    "packages/catopt-core/src",
    "packages/catopt-torch/src",
    "packages/catopt-carriers/src",
    "packages/catopt-eps/src",
    "packages/catopt-optimize/src",
]
exclude = [
    "packages/catopt-carriers/src/catopt_carriers/xcarrier.py",        # 164 — Optional-subscript/operand on un-narrowed dict lookups
    "packages/catopt-carriers/src/catopt_carriers/om.py",              #  87 — same Optional-heavy rewriting internals
    "packages/catopt-core/src/catopt_core/egraph/proof.py",    #  36 — attribute access on untyped proof objects
    "packages/catopt-core/src/catopt_core/egraph/extract.py",  #  32 — attribute access on untyped extraction state
    "packages/catopt-carriers/src/catopt_carriers/om_lower.py",        #  22 — Optional subscripts + incompatible override
    "packages/catopt-core/src/catopt_core/typing.py",          #  18 — generic helpers; arg-type mismatches
    "packages/catopt-carriers/src/catopt_carriers/scan_lower.py",      #  11 — Optional subscripts; None in Tensor dicts
    "packages/catopt-core/src/catopt_core/cost.py",            #  10 — FunctionType attr assignment; object→float
    "packages/catopt-carriers/src/catopt_carriers/omd_lower.py",       #   9 — Optional subscripts; None in Tensor dicts
    "packages/catopt-eps/src/catopt_eps/eps.py",             #   8 — possibly-unbound vars; Optional args
    "packages/catopt-eps/src/catopt_eps/ibp.py",             #   7 — Optional member access on Box intervals
    "packages/catopt-core/src/catopt_core/laws/tensor.py",     #   7 — Op passed where str expected
    "packages/catopt-torch/src/catopt_torch/torch_bridge.py",    #   7 — Optional attrs; torch Module return types
    "packages/catopt-optimize/src/catopt_optimize/optimize.py",        #   6 — "IR not iterable"; arg-type mismatches
    "packages/catopt-torch/src/catopt_torch/report.py",          #   5 — Optional member access; None args
    "packages/catopt-core/src/catopt_core/meta.py",            #   3 — list↔dict assignment mismatches
    "packages/catopt-torch/src/catopt_torch/models/__init__.py", #   3 — nn.Module __getitem__; int→Tensor return
    "packages/catopt-torch/src/catopt_torch/models/ssm.py",      #   2 — Tensor|Module arithmetic operators
    "packages/catopt-optimize/src/catopt_optimize/regime.py",          #   2 — Tensor−object op; IR not iterable
    "packages/catopt-core/src/catopt_core/egraph/core.py",     #   1 — dict return-type mismatch
    "packages/catopt-core/src/catopt_core/ir.py",              #   1 — int * Optional[int]
    "packages/catopt-core/src/catopt_core/laws/pairing.py",    #   1 — tuple assigned to list[int]
]
pythonVersion = "3.13"
# torch and numpy ship usable stubs; keep missing imports an error so a
# broken environment fails loudly instead of silently degrading to Any.
reportMissingImports = "error"

[tool.coverage.run]
source = ["catopt_core", "catopt_torch", "catopt_carriers", "catopt_eps", "catopt_optimize", "catopt"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 100       # ratcheted upward each refactor phase; target 100
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]
