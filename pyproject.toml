[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt"
version = "0.1.0dev"
description = "Categorical optimization of neural-network computation graphs — meta distribution (façade over the domain packages in packages/)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catopt-core",
    "catopt-torch",
    "catopt-carriers",
    "catopt-optimize",
    "catopt-cuda",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "ty>=0.0.84",
    "vulture>=2.16",
    "import-linter>=2.15",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

[dependency-groups]
bench = [
    "matplotlib>=3.8",
    "pandas>=2.0",
]
# OPT-IN, TEST-ONLY differential oracle (Phase 4).  `egglog` drives a
# second equality-saturation engine used *only* by
# tests/test_egglog_oracle.py to cross-check catopt's search on a small
# op/law subset.  It is deliberately NOT in `dev`: the repo stays light
# (egglog is a compiled Rust extension), the oracle test self-skips via
# `pytest.importorskip("egglog")` when the group is absent, and nothing
# under packages/ or catopt/ imports it.  Run with:
#   uv sync --group oracle && .venv/bin/python -m pytest tests/test_egglog_oracle.py
# egglog ships wheels for CPython >= 3.12 only, so the entry carries a
# `python_version` marker: the workspace still declares `>=3.11`, but
# the oracle group only resolves on the 3.12+ interpreters that can run
# it (the dev venv is 3.13).
oracle = [
    "egglog>=14.0; python_version >= '3.12'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "ty>=0.0.84",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["catopt"]
exclude = ["packages*", "tests*", "bench*"]

# --- uv workspace: the domain packages ---------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
catopt-core = { workspace = true }
catopt-torch = { workspace = true }
catopt-carriers = { workspace = true }
catopt-optimize = { workspace = true }
catopt-cuda = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
]

# --- dead-code + architecture linting (dev tooling) ----------------
# vulture: flag unreachable/unused code at high confidence.  The suite
# is pinned at 100% coverage, so a genuine dead branch is a real
# finding, not noise.  Run `.venv/bin/vulture` (uses these paths) or
# `.venv/bin/vulture packages catopt tests --min-confidence 80`; a
# non-zero exit (3) means dead code.  If a public member is kept only
# for the compatibility aliases, add its name to `ignore_names` here
# rather than leaving a false positive.
[tool.vulture]
min_confidence = 80
paths = ["packages", "catopt", "tests"]

# import-linter: the hexagonal-boundary ratchet.  The key contract is
# "core is torch-free" — catopt-core (the zero-dependency engine) must
# never import the PyTorch adapter or any sibling domain package.  It
# FAILS on the pre-decoupling tree and is the gate Phase 1 makes green.
[tool.importlinter]
root_packages = [
    "catopt_core",
    "catopt_torch",
    "catopt_carriers",
    "catopt_optimize",
    "catopt_cuda",
    "catopt",
]
# Required so the "core imports no tensor library" contract can forbid
# the external torch/numpy packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is torch-free (and carrier-free)"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = [
    "catopt_torch",
    "catopt_carriers",
    "catopt_optimize",
    "catopt_cuda",
]

[[tool.importlinter.contracts]]
name = "core imports no tensor library"
type = "forbidden"
source_modules = ["catopt_core"]
forbidden_modules = ["torch", "numpy"]

[[tool.importlinter.contracts]]
name = "orchestrator imports no backend"
type = "forbidden"
source_modules = ["catopt_optimize"]
forbidden_modules = ["torch", "catopt_torch", "catopt_cuda"]
# The backend packages may never be imported directly — backend
# specifics live behind the Composer/Meter/Runner/ExecutorSpec ports.
# Indirect reach is fine: the orchestrator lazily resolves carrier
# machinery (catopt_carriers), which is what pulls torch — the runtime
# boundary test (sys.modules stays torch-free after
# `import catopt_optimize`) is the gate that pins the laziness.
allow_indirect_imports = true

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

# The docstring gate applies to shipped code only: tests and bench are
# example/measurement code, not a public API surface.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
# ty is Astral's type checker (it replaced the earlier pyright ratchet).
# `[tool.ty.src] include` scopes checking to the shipped packages
# (tests/ and bench/ are not type-checked).  The ratchet `exclude` list
# is now EMPTY: every file that carried a baseline error count has been
# annotated, so `ty check` is clean with no opt-outs.  Keep it that way
# — add annotations, not exclude entries.  New modules under
# packages/*/src/ are checked automatically.
[tool.ty.environment]
python-version = "3.13"
extra-paths = [
    "packages/catopt-core/src",
    "packages/catopt-torch/src",
    "packages/catopt-carriers/src",
    "packages/catopt-optimize/src",
    "packages/catopt-cuda/src",
]

[tool.ty.src]
include = ["packages", "catopt"]
exclude = []

[tool.ty.terminal]
# Errors are fatal, warnings are not.
error-on-warning = false

[tool.coverage.run]
source = ["catopt_core", "catopt_torch", "catopt_carriers", "catopt_optimize", "catopt_cuda", "catopt"]
branch = true
omit = ["*/tests/*"]

# --- mutation testing (mutmut) -------------------------------------
# Detects weak tests: a mutant that survives means the suite asserts
# nothing about that line.  Run it through the wrapper, which builds the
# flat-layout sandbox mutmut needs (its keys are path-derived, but this
# monorepo's per-package ``src/`` layout imports under a different dotted
# name):
#   MUTMUT_ONLY=catopt_core/ir.py MUTMUT_TESTS='tests/test_ir.py' \
#       tools/mutmut.sh run
#   tools/mutmut.sh results
# There is intentionally no ``[tool.mutmut]`` table here: the wrapper
# writes one into the sandbox, and a direct in-repo run would mis-key
# every mutant.  Surviving mutants are weak-assertion findings, not
# coverage gaps (the suite is pinned at 100%).

[tool.coverage.report]
fail_under = 100       # ratcheted upward each refactor phase; target 100
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]
