repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        # Whole-project typecheck: [tool.ty.src] include/exclude in
        # pyproject.toml scope it to packages/ + catopt/ and pin the
        # ratchet baseline.  ty is fast (Rust), so this is whole-tree.
        entry: .venv/bin/ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: import-linter
        # Whole-project (not per-file): the [tool.importlinter] contracts
        # in pyproject.toml — core must not import the torch adapter or
        # any tensor library.  Requires `uv sync` (dev group).
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture
        # Whole-project dead-code scan; paths + min-confidence come from
        # [tool.vulture] in pyproject.toml.  Requires `uv sync`.
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: bandit
        # Security SAST; excludes + justified skips in .bandit.yaml.
        entry: .venv/bin/bandit -c .bandit.yaml -r packages catopt
        language: system
        pass_filenames: false
        always_run: true
      - id: semgrep
        name: semgrep
        # Offline, deterministic ruleset from .semgrep.yml.  For the
        # deeper registry scan run (network) see AGENTS.md:
        #   .venv/bin/semgrep --config p/python --config p/security-audit
        entry: .venv/bin/semgrep --config .semgrep.yml packages catopt
        language: system
        pass_filenames: false
        always_run: true
      - id: radon-ratchet
        name: radon complexity ratchet
        # No function may exceed its baseline in
        # tools/complexity_baseline.json; new functions must stay <= C.
        entry: .venv/bin/python tools/radon_ratchet.py
        language: system
        pass_filenames: false
        always_run: true
      - id: runtime-types
        name: typeguard runtime contracts
        # Runtime enforcement of annotations over the torch-free core.
        # Curated green subset; see AGENTS.md for the annotation backlog
        # that blocks whole-suite instrumentation.
        entry: >-
          .venv/bin/python -m pytest -q -p no:cacheprovider
          --typeguard-packages=catopt_core
          tests/test_ir.py tests/test_egraph.py
          tests/test_laws_structure.py tests/test_cost.py
          tests/test_interning.py tests/test_attrs.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: pip-audit
        name: pip-audit
        # Dependency-vulnerability audit of the installed environment.
        # Needs network access, so it is a manual-stage gate.
        entry: .venv/bin/pip-audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: semgrep-registry
        name: semgrep (registry rulesets)
        # Deeper dataflow/security scan; downloads the p/python +
        # p/security-audit rulesets, so it is a manual-stage gate.
        entry: >-
          .venv/bin/semgrep --config .semgrep.yml --config p/python
          --config p/security-audit packages catopt
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
