repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        # Per-file invocation: files passed explicitly still honor the
        # `exclude` list in pyproject.toml, so excluded modules stay green
        # while every checked module is verified. Config: [tool.pyright].
        entry: .venv/bin/pyright
        language: system
        types: [python]
        files: ^(catopt|packages)/.*\.py$
      - id: import-linter
        name: import-linter
        # Whole-project (not per-file): the [tool.importlinter] contracts
        # in pyproject.toml — core must not import the torch adapter or
        # any tensor library.  Requires `uv sync` (dev group).
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture
        # Whole-project dead-code scan; paths + min-confidence come from
        # [tool.vulture] in pyproject.toml.  Requires `uv sync`.
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        always_run: true
